name: Slicer surface geometry
on: [push, pull_request]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy vtk pytest scipy
      - run: python -m compileall -q DermaDose_Surface/DermaDose_Surface/slicer_extension/DermaDoseSurface
      - run: python -m pytest tests/test_surface_range.py -v
