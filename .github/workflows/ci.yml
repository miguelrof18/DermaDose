name: Pruebas del programa
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python scripts/validate_benmakhlouf.py
      - run: python -m skindose_verifier demo --model mesh --out resultados/ci_demo --stage skin_dose
